# Refits the model on the latest NFL data and redeploys the app to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Refresh projections

on:
  schedule:
    - cron: "17 13 * 9-12,1 2,5"   # Tue + Fri mornings (US), September through January
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy scipy scikit-learn pyarrow
      - name: Restore downloaded NFL data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nfl-raw-${{ github.run_id }}
          restore-keys: nfl-raw-
      - name: Fit model and project the rest of the season
        run: python scripts/build_rankings.py --refresh --season "$(python -c 'import datetime as d; t=d.date.today(); print(t.year if t.month >= 8 else t.year - 1)')"
      - name: Bundle the app
        run: python scripts/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
